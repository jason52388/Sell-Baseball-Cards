<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Collection</title>
  <link rel="stylesheet" href="/static/styles.css?v=8" />
</head>
<body>
  <header>
    <h1>🃏 Sell Cards</h1>
    <a href="/">Upload</a>
    <a href="/repository">My Collection</a>
  </header>
  <main class="wide">
    <div id="modeBanner" class="muted" style="margin-bottom:12px"></div>
    <div id="kpis" class="kpis"></div>
    <div class="filters">
      <label>Show:
        <select id="filter">
          <option value="" selected>All</option>
          <option value="priced">Priced (sellable)</option>
          <option value="needs_review">Needs review</option>
          <option value="below_threshold">Below $4</option>
          <option value="listed">Listed</option>
          <option value="duplicates">Duplicates</option>
          <option value="unmatched_backs">Unmatched backs</option>
        </select>
      </label>
      <label>Sport:
        <select id="sportFilter"><option value="" selected>All</option></select>
      </label>
      <label>Tag:
        <select id="tagFilter"><option value="" selected>All</option></select>
      </label>
      <label>Player: <input type="search" id="playerSearch" placeholder="search name…" /></label>
      <label>Price $: <input type="number" id="minPrice" placeholder="min" min="0" step="0.01" style="width:5.5em" />
        – <input type="number" id="maxPrice" placeholder="max" min="0" step="0.01" style="width:5.5em" /></label>
      <label><input type="checkbox" id="psaOnly" /> PSA 10 candidates</label>
      <label><input type="checkbox" id="anomOnly" /> Anomalies</label>
      <button id="sellBtn" disabled>Sell selected</button>
      <button id="refreshPricesBtn" title="Re-fetch fresh prices for every card (ignores the cache)">Refresh prices</button>
    </div>
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selAll" title="Select all sellable" /></th>
          <th>Your photo</th><th>Market photo</th><th>Tag</th><th>Sport</th><th>Player</th>
          <th>Year / Set</th><th>#</th><th>Parallel</th><th>Cond.</th><th>Conf.</th>
          <th>PSA 10?</th><th>Photo</th><th>Flags</th><th>Last sold</th><th>Max sold</th><th>Current asking</th><th>Est. (basis)</th>
          <th>Graded</th><th>List ×1.5</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/static/app.js?v=8"></script>
  <script>initRepository();</script>
</body>
</html>
