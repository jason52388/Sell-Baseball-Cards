<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Repository</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>⚾ Sell Baseball Cards</h1>
    <a href="/">Upload</a>
    <a href="/repository">Repository</a>
  </header>
  <main>
    <div id="modeBanner" class="muted" style="margin-bottom:12px"></div>
    <div class="filters">
      <label>Show:
        <select id="filter">
          <option value="priced">Priced (sellable)</option>
          <option value="needs_review">Needs review</option>
          <option value="below_threshold">Below $4</option>
          <option value="listed">Listed</option>
          <option value="">All</option>
        </select>
      </label>
      <label><input type="checkbox" id="psaOnly" /> PSA 10 candidates</label>
      <label><input type="checkbox" id="anomOnly" /> Anomalies</label>
      <button id="sellBtn" disabled>I want to sell these</button>
    </div>
    <table>
      <thead>
        <tr>
          <th></th><th>Your photo</th><th>Market photo</th><th>Player</th>
          <th>Year / Set</th><th>#</th><th>Parallel</th><th>Cond.</th><th>Conf.</th>
          <th>Flags</th><th>Last sold</th><th>Current asking</th><th>Est. (basis)</th>
          <th>Graded</th><th>List ×1.5</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/static/app.js"></script>
  <script>initRepository();</script>
</body>
</html>
