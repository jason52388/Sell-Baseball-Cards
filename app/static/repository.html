<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collection</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/styles.css?v=20" />
</head>
<body>
  <header id="top" class="top"><h1>Sell Cards</h1></header>
  <main>
    <div id="banner" class="hidden"></div>
    <div class="kpis" id="kpis"></div>

    <div class="bar" id="chips"></div>
    <div class="bar">
      <select id="sportFilter" aria-label="Sport"><option value="">All sports</option></select>
      <select id="tagFilter" aria-label="Tag"><option value="">All tags</option></select>
      <select id="sort" aria-label="Sort">
        <option value="value_desc">Sort: value, high to low</option>
        <option value="value_asc">Sort: value, low to high</option>
        <option value="list_desc">Sort: list price, high to low</option>
        <option value="newest">Sort: newest first</option>
        <option value="oldest">Sort: oldest first</option>
        <option value="player">Sort: player A to Z</option>
      </select>
      <div class="dropdown">
        <button class="btn ghost" id="moreBtn" type="button">More filters</button>
        <div class="dropdown-panel hidden" id="morePanel">
          <div class="row"><span class="muted small">Value $</span>
            <input type="number" id="minPrice" placeholder="min" min="0" step="0.01" />
            <span class="muted">to</span>
            <input type="number" id="maxPrice" placeholder="max" min="0" step="0.01" /></div>
          <label class="check"><input type="checkbox" id="psaOnly" /> Possible PSA 10 only</label>
          <label class="check"><input type="checkbox" id="anomOnly" /> Unusual cards only (errors, misprints)</label>
          <label class="check"><input type="checkbox" id="noPriceOnly" /> No price only</label>
          <button class="linkbtn" id="clearMore" type="button">Clear these</button>
        </div>
      </div>
      <button class="btn ghost" id="syncBtn" type="button" title="Ask eBay which listed cards have sold">Check for sales</button>
      <button class="btn ghost" id="repriceAllBtn" type="button" title="Look up fresh prices for every card">Refresh all prices</button>
      <span class="seg grow table-only" role="group" aria-label="View">
        <button type="button" data-view="list">List</button><button type="button" data-view="grid">Grid</button>
      </span>
    </div>

    <div id="jobLine" class="progress-line hidden"></div>

    <div id="selbar" class="selbar hidden">
      <b id="selCount"></b>
      <button class="btn" id="selList" type="button">List on eBay</button>
      <button class="btn" id="selLot" type="button">List as one lot</button>
      <button class="btn" id="selReprice" type="button">Refresh prices</button>
      <button class="clear" id="selClear" type="button">Clear</button>
    </div>

    <div id="view"></div>
  </main>

  <script src="/static/common.js?v=20"></script>
  <script src="/static/collection.js?v=20"></script>
</body>
</html>
